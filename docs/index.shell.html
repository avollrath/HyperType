<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<meta name="theme-color" content="#05070d">
	<meta name="description" content="HyperType web build">
	<title>__GAME_TITLE__</title>
	<link rel="icon" type="image/png" href="__ICON_PATH__">
	<link rel="apple-touch-icon" href="__APPLE_ICON_PATH__">
	<style>
		:root {
			--bg: #04060d;
			--panel: rgba(3, 6, 18, 0.82);
			--panel-border: rgba(255, 0, 186, 0.95);
			--panel-glow: rgba(0, 208, 255, 0.18);
			--text: #f6f7fb;
			--muted: #aab4d6;
			--accent: #ff00b8;
			--accent-2: #00d6ff;
			--danger-bg: rgba(98, 29, 45, 0.92);
			--danger-border: rgba(255, 86, 146, 0.9);
			--canvas-shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			margin: 0;
			padding: 0;
			min-height: 100%;
			background:
				radial-gradient(circle at top, rgba(0, 214, 255, 0.18), transparent 30%),
				radial-gradient(circle at bottom, rgba(255, 0, 184, 0.16), transparent 35%),
				linear-gradient(180deg, #03040a 0%, #060913 55%, #03040a 100%);
			color: var(--text);
			font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
			overflow: hidden;
			touch-action: none;
		}

		body {
			display: grid;
			place-items: center;
		}

		#app {
			position: relative;
			width: 100vw;
			height: 100vh;
			overflow: hidden;
		}

		#canvas {
			display: block;
			width: 100%;
			height: 100%;
			outline: none;
			box-shadow: var(--canvas-shadow);
		}

		#shell {
			position: absolute;
			inset: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 24px;
			background:
				linear-gradient(180deg, rgba(2, 4, 14, 0.6), rgba(2, 4, 14, 0.88)),
				radial-gradient(circle at top, rgba(0, 214, 255, 0.12), transparent 35%),
				radial-gradient(circle at bottom, rgba(255, 0, 184, 0.12), transparent 35%);
			backdrop-filter: blur(4px);
		}

		#shell.hidden {
			display: none;
		}

		.shell-panel {
			width: min(92vw, 880px);
			padding: 28px;
			border: 2px solid var(--panel-border);
			border-radius: 28px;
			background: var(--panel);
			box-shadow:
				0 0 0 1px rgba(255, 255, 255, 0.04) inset,
				0 24px 80px rgba(0, 0, 0, 0.45),
				0 0 60px var(--panel-glow);
		}

		.shell-header {
			display: grid;
			gap: 16px;
		}

		.shell-kicker {
			margin: 0;
			font-size: 12px;
			font-weight: 700;
			letter-spacing: 0.24em;
			text-transform: uppercase;
			color: var(--accent-2);
		}

		.shell-title {
			margin: 0;
			font-size: clamp(32px, 5vw, 64px);
			font-weight: 900;
			line-height: 0.95;
			letter-spacing: 0.04em;
			color: var(--accent);
			text-transform: uppercase;
			text-shadow: 0 0 18px rgba(255, 0, 184, 0.35);
		}

		.shell-copy {
			margin: 0;
			max-width: 60ch;
			font-size: 15px;
			line-height: 1.6;
			color: var(--muted);
		}

		.shell-splash-wrap {
			margin-top: 24px;
			border-radius: 18px;
			overflow: hidden;
			border: 1px solid rgba(255, 255, 255, 0.08);
			background: rgba(0, 0, 0, 0.35);
		}

		#status-splash {
			display: block;
			width: 100%;
			max-height: min(44vh, 420px);
			object-fit: cover;
		}

		.shell-footer {
			display: grid;
			gap: 14px;
			margin-top: 22px;
		}

		.shell-meta {
			display: flex;
			flex-wrap: wrap;
			gap: 10px;
			font-size: 12px;
			color: var(--muted);
			text-transform: uppercase;
			letter-spacing: 0.12em;
		}

		.shell-pill {
			padding: 8px 12px;
			border: 1px solid rgba(255, 255, 255, 0.08);
			border-radius: 999px;
			background: rgba(255, 255, 255, 0.03);
		}

		#status-progress {
			width: 100%;
			height: 12px;
			appearance: none;
			border: 0;
			border-radius: 999px;
			overflow: hidden;
			background: rgba(255, 255, 255, 0.08);
		}

		#status-progress::-webkit-progress-bar {
			background: rgba(255, 255, 255, 0.08);
		}

		#status-progress::-webkit-progress-value {
			background: linear-gradient(90deg, var(--accent-2), var(--accent));
		}

		#status-progress::-moz-progress-bar {
			background: linear-gradient(90deg, var(--accent-2), var(--accent));
		}

		#status-label {
			font-size: 13px;
			color: var(--muted);
			letter-spacing: 0.08em;
			text-transform: uppercase;
		}

		#status-notice {
			display: none;
			padding: 14px 16px;
			border-radius: 14px;
			border: 1px solid var(--danger-border);
			background: var(--danger-bg);
			color: #ffe5ee;
			line-height: 1.5;
			font-size: 14px;
		}

		@media (max-width: 720px) {
			#shell {
				padding: 14px;
			}

			.shell-panel {
				padding: 18px;
				border-radius: 20px;
			}

			.shell-copy {
				font-size: 14px;
			}
		}
	</style>
</head>
<body>
	<div id="app">
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			JavaScript is required to run this game.
		</noscript>

		<div id="shell">
			<div class="shell-panel">
				<div class="shell-header">
					<p class="shell-kicker">Web Build</p>
					<h1 class="shell-title">__GAME_TITLE__</h1>
					<p class="shell-copy">__GAME_TAGLINE__</p>
				</div>

				<div class="shell-splash-wrap">
					<img id="status-splash" src="__SPLASH_PATH__" alt="__GAME_TITLE__ splash art">
				</div>

				<div class="shell-footer">
					<div class="shell-meta">
						<span class="shell-pill">Executable: __EXECUTABLE__</span>
						<span class="shell-pill">Renderer: Web</span>
						<span class="shell-pill">Build: __BUILD_LABEL__</span>
					</div>
					<div id="status-label">Loading build...</div>
					<progress id="status-progress"></progress>
					<div id="status-notice"></div>
				</div>
			</div>
		</div>
	</div>

	<script src="__EXECUTABLE__.js"></script>
	<script>
		const GODOT_CONFIG = {
			args: [],
			canvasResizePolicy: 2,
			ensureCrossOriginIsolationHeaders: true,
			executable: "__EXECUTABLE__",
			experimentalVK: false,
			fileSizes: {
				"__EXECUTABLE__.pck": __PCK_SIZE__,
				"__EXECUTABLE__.wasm": __WASM_SIZE__
			},
			focusCanvas: true,
			gdextensionLibs: []
		};

		const GODOT_THREADS_ENABLED = false;
		const engine = new Engine(GODOT_CONFIG);

		(function () {
			const shell = document.getElementById("shell");
			const statusProgress = document.getElementById("status-progress");
			const statusNotice = document.getElementById("status-notice");
			const statusLabel = document.getElementById("status-label");

			let initializing = true;

			function hideShell() {
				shell.classList.add("hidden");
				initializing = false;
			}

			function setLabel(text) {
				statusLabel.textContent = text;
			}

			function setNotice(text) {
				statusNotice.style.display = "block";
				statusNotice.textContent = text;
			}

			function displayFailureNotice(err) {
				console.error(err);
				if (err instanceof Error) {
					setNotice(err.message);
				} else if (typeof err === "string") {
					setNotice(err);
				} else {
					setNotice("An unknown error occurred while starting the game.");
				}
				setLabel("Startup failed");
				initializing = false;
			}

			const missing = Engine.getMissingFeatures({
				threads: GODOT_THREADS_ENABLED
			});

			if (missing.length !== 0) {
				if (
					GODOT_CONFIG.serviceWorker &&
					GODOT_CONFIG.ensureCrossOriginIsolationHeaders &&
					"serviceWorker" in navigator
				) {
					Promise.race([
						navigator.serviceWorker.getRegistration().then((registration) => {
							if (registration != null) {
								return Promise.reject(new Error("Service worker already exists."));
							}
							return registration;
						}).then(() => engine.installServiceWorker()),
						new Promise((resolve) => {
							setTimeout(() => resolve(), 2000);
						})
					]).catch((err) => {
						console.error("Error while registering service worker:", err);
					}).then(() => {
						window.location.reload();
					});
				} else {
					displayFailureNotice(
						"Missing required browser features:\n" + missing.join("\n")
					);
				}
				return;
			}

			setLabel("Loading engine...");
			engine.startGame({
				onProgress: function (current, total) {
					if (!initializing) {
						return;
					}

					setLabel("Loading build...");
					if (current > 0 && total > 0) {
						statusProgress.value = current;
						statusProgress.max = total;
					} else {
						statusProgress.removeAttribute("value");
						statusProgress.removeAttribute("max");
					}
				}
			}).then(() => {
				hideShell();
			}, displayFailureNotice);
		}());
	</script>
</body>
</html>
