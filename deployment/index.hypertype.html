<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<meta name="theme-color" content="#05070d">
	<meta name="description" content="HyperType is a neon arcade typing shooter built with Godot.">
	<title>HyperType</title>
	<link rel="icon" type="image/png" href="index.icon.png">
	<link rel="apple-touch-icon" href="index.apple-touch-icon.png">
	<style>
		:root {
			--bg: #04060d;
			--panel: rgba(4, 6, 18, 0.84);
			--panel-border: rgba(255, 0, 186, 0.92);
			--panel-glow: rgba(0, 214, 255, 0.18);
			--text: #f5f7ff;
			--muted: #a9b7df;
			--accent: #ff00b8;
			--accent-2: #00d6ff;
			--danger-bg: rgba(86, 24, 42, 0.92);
			--danger-border: rgba(255, 109, 157, 0.9);
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			touch-action: none;
			background:
				radial-gradient(circle at top, rgba(0, 214, 255, 0.18), transparent 28%),
				radial-gradient(circle at bottom, rgba(255, 0, 184, 0.16), transparent 34%),
				linear-gradient(180deg, #020309 0%, #050913 55%, #020309 100%);
			color: var(--text);
			font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
		}

		body {
			display: grid;
			place-items: center;
		}

		#app {
			position: relative;
			width: 100vw;
			height: 100vh;
			overflow: hidden;
		}

		#canvas {
			display: block;
			width: 100%;
			height: 100%;
			outline: none;
		}

		#shell {
			position: absolute;
			inset: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 24px;
			background:
				linear-gradient(180deg, rgba(2, 4, 14, 0.55), rgba(2, 4, 14, 0.88)),
				radial-gradient(circle at top, rgba(0, 214, 255, 0.12), transparent 35%),
				radial-gradient(circle at bottom, rgba(255, 0, 184, 0.14), transparent 35%);
			backdrop-filter: blur(4px);
		}

		#shell.hidden {
			display: none;
		}

		.shell-panel {
			width: min(92vw, 920px);
			padding: 28px;
			border: 2px solid var(--panel-border);
			border-radius: 28px;
			background: var(--panel);
			box-shadow:
				0 0 0 1px rgba(255, 255, 255, 0.04) inset,
				0 24px 80px rgba(0, 0, 0, 0.45),
				0 0 64px var(--panel-glow);
		}

		.shell-kicker {
			margin: 0 0 12px;
			font-size: 12px;
			font-weight: 700;
			letter-spacing: 0.24em;
			text-transform: uppercase;
			color: var(--accent-2);
		}

		.shell-title {
			margin: 0;
			font-size: clamp(40px, 7vw, 84px);
			line-height: 0.92;
			font-weight: 900;
			letter-spacing: 0.05em;
			text-transform: uppercase;
			color: var(--accent);
			text-shadow: 0 0 20px rgba(255, 0, 184, 0.35);
		}

		.shell-copy {
			margin: 18px 0 0;
			max-width: 60ch;
			font-size: 15px;
			line-height: 1.65;
			color: var(--muted);
		}

		.shell-splash-wrap {
			margin-top: 24px;
			border-radius: 18px;
			overflow: hidden;
			border: 1px solid rgba(255, 255, 255, 0.08);
			background: rgba(0, 0, 0, 0.35);
		}

		#status-splash {
			display: block;
			width: 100%;
			max-height: min(44vh, 430px);
			object-fit: cover;
		}

		.shell-footer {
			display: grid;
			gap: 14px;
			margin-top: 22px;
		}

		.shell-meta {
			display: flex;
			flex-wrap: wrap;
			gap: 10px;
			font-size: 12px;
			color: var(--muted);
			text-transform: uppercase;
			letter-spacing: 0.12em;
		}

		.shell-pill {
			padding: 8px 12px;
			border: 1px solid rgba(255, 255, 255, 0.08);
			border-radius: 999px;
			background: rgba(255, 255, 255, 0.03);
		}

		#status-label {
			font-size: 13px;
			color: var(--muted);
			letter-spacing: 0.08em;
			text-transform: uppercase;
		}

		#status-progress {
			width: 100%;
			height: 12px;
			appearance: none;
			border: 0;
			border-radius: 999px;
			overflow: hidden;
			background: rgba(255, 255, 255, 0.08);
		}

		#status-progress::-webkit-progress-bar {
			background: rgba(255, 255, 255, 0.08);
		}

		#status-progress::-webkit-progress-value {
			background: linear-gradient(90deg, var(--accent-2), var(--accent));
		}

		#status-progress::-moz-progress-bar {
			background: linear-gradient(90deg, var(--accent-2), var(--accent));
		}

		#status-notice {
			display: none;
			padding: 14px 16px;
			border-radius: 14px;
			border: 1px solid var(--danger-border);
			background: var(--danger-bg);
			color: #ffe6ee;
			line-height: 1.5;
			font-size: 14px;
			white-space: pre-line;
		}

		@media (max-width: 720px) {
			#shell {
				padding: 14px;
			}

			.shell-panel {
				padding: 18px;
				border-radius: 20px;
			}

			.shell-copy {
				font-size: 14px;
			}
		}
	</style>
</head>
<body>
	<div id="app">
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			JavaScript is required to run HyperType.
		</noscript>

		<div id="shell">
			<div class="shell-panel">
				<p class="shell-kicker">Arcade Typing Shooter</p>
				<h1 class="shell-title">HyperType</h1>
				<p class="shell-copy">
					Type fast, hold your streak, and vaporize incoming enemies in a neon-soaked synthwave battlefield.
					Load up, lock in, and chase a better run.
				</p>

				<div class="shell-splash-wrap">
					<img id="status-splash" src="index.png" alt="HyperType splash image">
				</div>

				<div class="shell-footer">
					<div class="shell-meta">
						<span class="shell-pill">Godot Web Build</span>
						<span class="shell-pill">Executable: index</span>
						<span class="shell-pill">1600 x 900</span>
					</div>
					<div id="status-label">Loading build...</div>
					<progress id="status-progress"></progress>
					<div id="status-notice"></div>
				</div>
			</div>
		</div>
	</div>

	<script src="index.js"></script>
	<script>
		const GODOT_CONFIG = {
			args: [],
			canvasResizePolicy: 2,
			ensureCrossOriginIsolationHeaders: true,
			executable: "index",
			experimentalVK: false,
			fileSizes: {
				"index.pck": 24904480,
				"index.wasm": 43016933
			},
			focusCanvas: true,
			gdextensionLibs: []
		};

		const GODOT_THREADS_ENABLED = false;
		const engine = new Engine(GODOT_CONFIG);

		(function () {
			const shell = document.getElementById("shell");
			const statusProgress = document.getElementById("status-progress");
			const statusNotice = document.getElementById("status-notice");
			const statusLabel = document.getElementById("status-label");

			let initializing = true;

			function hideShell() {
				shell.classList.add("hidden");
				initializing = false;
			}

			function setLabel(text) {
				statusLabel.textContent = text;
			}

			function setNotice(text) {
				statusNotice.style.display = "block";
				statusNotice.textContent = text;
			}

			function displayFailureNotice(err) {
				console.error(err);
				if (err instanceof Error) {
					setNotice(err.message);
				} else if (typeof err === "string") {
					setNotice(err);
				} else {
					setNotice("An unknown error occurred while starting HyperType.");
				}
				setLabel("Startup failed");
				initializing = false;
			}

			const missing = Engine.getMissingFeatures({
				threads: GODOT_THREADS_ENABLED
			});

			if (missing.length !== 0) {
				if (
					GODOT_CONFIG.serviceWorker &&
					GODOT_CONFIG.ensureCrossOriginIsolationHeaders &&
					"serviceWorker" in navigator
				) {
					Promise.race([
						navigator.serviceWorker.getRegistration().then((registration) => {
							if (registration != null) {
								return Promise.reject(new Error("Service worker already exists."));
							}
							return registration;
						}).then(() => engine.installServiceWorker()),
						new Promise((resolve) => {
							setTimeout(() => resolve(), 2000);
						})
					]).catch((err) => {
						console.error("Error while registering service worker:", err);
					}).then(() => {
						window.location.reload();
					});
				} else {
					displayFailureNotice(
						"Missing required browser features:\n" + missing.join("\n")
					);
				}
				return;
			}

			setLabel("Loading engine...");
			engine.startGame({
				onProgress: function (current, total) {
					if (!initializing) {
						return;
					}

					setLabel("Loading build...");
					if (current > 0 && total > 0) {
						statusProgress.value = current;
						statusProgress.max = total;
					} else {
						statusProgress.removeAttribute("value");
						statusProgress.removeAttribute("max");
					}
				}
			}).then(() => {
				hideShell();
			}, displayFailureNotice);
		}());
	</script>
</body>
</html>
